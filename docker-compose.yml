services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rd_secret}
      POSTGRES_DB: ${POSTGRES_DB:-metallurgy_rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rd_user} -d ${POSTGRES_DB:-metallurgy_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -s3 -dir=/data"
    volumes:
      - s3data:/data
    networks:
      - internal_net

  pdf-parser:
    image: quay.io/docling-project/docling-serve:latest
    profiles: ["ml"]
    networks:
      - internal_net

  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_CPP_IMAGE_TAG:-server-cuda}
    profiles: ["ml"]
    command: >
      -m /models/gguf/${LLM_MODEL_FILE:-Qwen3.8-27B-UD-Q4_K_M.gguf}
      --host 0.0.0.0
      --port 8080
      -c ${LLM_CTX_SIZE:-32768}
      -ngl ${LLM_GPU_LAYERS:-28}
      --flash-attn on
      --jinja
      --reasoning-format deepseek
      --no-context-shift
      --cont-batching
      -ctk q8_0
      -ctv q8_0
      -np ${LLM_PARALLEL_SLOTS:-4}
      ${LLAMA_ARG_CPU_MOE:-}
    volumes:
      - ./models:/models:ro
    networks:
      - internal_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  ml-inference:
    build:
      context: .
      dockerfile: services/ml-inference/Dockerfile
      args:
        TORCH_BACKEND: ${TORCH_BACKEND:-cpu}
    profiles: ["ml"]
    environment:
      MODELS_DIR: /models
      ML_INFERENCE_DEVICE: ${ML_INFERENCE_DEVICE:-cpu}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-Qwen/Qwen3-Reranker-0.6B}
      ML_BATCH_MAX_SIZE: ${ML_BATCH_MAX_SIZE:-32}
      ML_BATCH_MAX_WAIT_MS: ${ML_BATCH_MAX_WAIT_MS:-10}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-4}
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./models:/models:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  egress-gateway:
    build:
      context: ./services/egress-gateway
    networks:
      - internal_net
      - egress_net

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - internal_net

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      egress-gateway:
        condition: service_started
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge
    internal: true
  egress_net:
    driver: bridge

volumes:
  pgdata:
  s3data:

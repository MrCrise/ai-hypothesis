[project]
name = "metallurgy-assistant-workspace"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[tool.uv.workspace]
members = [
    "packages/common",
    "packages/ingestion",
    "services/api",
    "services/orchestrator",
    "services/ml-inference",
    "eval",
]

[tool.uv.sources]
common = { workspace = true }
ingestion = { workspace = true }
api = { workspace = true }
orchestrator = { workspace = true }
ml-inference = { workspace = true }
eval = { workspace = true }

[tool.uv]
conflicts = [
  [
    { extra = "cpu", package = "ml-inference" },
    { extra = "cu124", package = "ml-inference" },
  ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pip-licenses>=5.0.0",
    "api",
    "orchestrator",
    "eval",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",
    "BLE001",
    "F841",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services", "packages", "eval"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true

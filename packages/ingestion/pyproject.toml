[project]
name = "ingestion"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "common",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "python-docx>=1.1.2",
    "docling-core>=2.103.0,<3",
    "pypdfium2>=4.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

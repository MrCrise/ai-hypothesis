[project]
name = "ml-inference"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "common",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.5.0",
    "transformers>=4.51.0",
    "accelerate>=1.2.0",
]
cu124 = [
    "torch>=2.5.0",
    "transformers>=4.51.0",
    "accelerate>=1.2.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
